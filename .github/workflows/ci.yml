name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify and validate changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.code || steps.fallback.outputs.code }}
      database: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.database || steps.fallback.outputs.database }}
      admin_e2e: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.admin_e2e || steps.fallback.outputs.admin_e2e }}
      chat_e2e: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.chat_e2e || steps.fallback.outputs.chat_e2e }}
      diff_range: ${{ steps.diff.outputs.diff_range }}
      docs_only: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.docs_only || steps.fallback.outputs.docs_only }}
      full_fallback: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.full_fallback || steps.fallback.outputs.full_fallback }}
      head_sha: ${{ steps.diff.outputs.head_sha }}
      operations: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.operations || steps.fallback.outputs.operations }}
      production_image: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.production_image || steps.fallback.outputs.production_image }}
      website_e2e: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.website_e2e || steps.fallback.outputs.website_e2e }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve comparison and changed paths
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_files="$RUNNER_TEMP/changed-files.zlist"
          : > "$changed_files"

          fail_closed() {
            fallback_head="$PUSH_HEAD_SHA"
            if [[ "$EVENT_NAME" == 'pull_request' && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              fallback_head="$PR_HEAD_SHA"
            fi
            printf '__ci_diff_unavailable__\0' > "$changed_files"
            echo 'diff_range=' >> "$GITHUB_OUTPUT"
            echo "head_sha=$fallback_head" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            separator='...'
          elif [[ "$EVENT_NAME" == 'push' ]]; then
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
            separator='..'
          else
            fail_closed
            exit 0
          fi

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$base_sha" == '0000000000000000000000000000000000000000' ]] ||
             ! git cat-file -e "${base_sha}^{commit}" ||
             ! git cat-file -e "${head_sha}^{commit}"; then
            fail_closed
            exit 0
          fi

          diff_range="${base_sha}${separator}${head_sha}"
          if ! git diff --name-only -z "$diff_range" > "$changed_files" ||
             [[ ! -s "$changed_files" ]]; then
            fail_closed
            exit 0
          fi

          echo "diff_range=$diff_range" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        continue-on-error: true
        run: node scripts/ci/classify-changes.mjs < "$RUNNER_TEMP/changed-files.zlist"

      - name: Preserve fail-closed outputs after classifier error
        id: fallback
        if: steps.classify.outcome != 'success'
        shell: bash
        run: |
          {
            echo 'docs_only=false'
            echo 'code=true'
            echo 'database=true'
            echo 'website_e2e=true'
            echo 'admin_e2e=true'
            echo 'chat_e2e=true'
            echo 'operations=true'
            echo 'production_image=true'
            echo 'full_fallback=true'
          } >> "$GITHUB_OUTPUT"

      - name: Validate repository diff and sensitive path boundary
        shell: bash
        env:
          DIFF_RANGE: ${{ steps.diff.outputs.diff_range }}
          FULL_FALLBACK: ${{ steps.classify.outcome == 'success' && steps.classify.outputs.full_fallback || steps.fallback.outputs.full_fallback }}
        run: |
          set -euo pipefail

          if [[ -z "$DIFF_RANGE" ]]; then
            if [[ "$FULL_FALLBACK" != 'true' ]]; then
              echo 'Missing diff range without full fallback.' >&2
              exit 1
            fi
            exit 0
          fi

          git diff --check "$DIFF_RANGE"

          forbidden=0
          while IFS= read -r -d '' path; do
            case "$path" in
              .env.example|.env.production.example)
                ;;
              .env|.env.*|data/*|media/*|uploads/*|backups/*|*.sqlite|*.sqlite3|*.dump)
                echo "Forbidden tracked path in change set: $path" >&2
                forbidden=1
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$DIFF_RANGE")

          if [[ "$forbidden" -ne 0 ]]; then
            exit 1
          fi

  fast:
    name: Fast CI
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

  full_gate:
    name: Path-specific full gate
    needs: [changes, fast]
    if: >-
      needs.changes.result == 'success' &&
      needs.fast.result == 'success' &&
      (github.event_name == 'push' || github.event.pull_request.draft == false) &&
      (needs.changes.outputs.database == 'true' ||
       needs.changes.outputs.website_e2e == 'true' ||
       needs.changes.outputs.admin_e2e == 'true' ||
       needs.changes.outputs.chat_e2e == 'true' ||
       needs.changes.outputs.operations == 'true' ||
       needs.changes.outputs.production_image == 'true' ||
       needs.changes.outputs.full_fallback == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:0.8.5-pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
        env:
          POSTGRES_DB: ivybm_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ivybm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADMIN_PORTAL_CONTENT_STUDIO_ENABLED: true
      ADMIN_PORTAL_CONVERSATIONS_ENABLED: true
      ADMIN_PORTAL_ENABLED: true
      ADMIN_PORTAL_KNOWLEDGE_ENABLED: true
      ADMIN_PORTAL_LEADS_ENABLED: true
      ADMIN_PORTAL_MEDIA_ENABLED: true
      ADMIN_PORTAL_OPERATIONS_ENABLED: true
      ADMIN_PORTAL_OVERVIEW_ENABLED: true
      ADMIN_PORTAL_PLATFORMS_ENABLED: true
      ADMIN_PORTAL_PUBLISHING_ENABLED: false
      ADMIN_PORTAL_SETTINGS_ENABLED: true
      ADMIN_PORTAL_WEBSITE_CONTENT_ENABLED: true
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivybm_ci
      PAYLOAD_SECRET: ci-build-only-secret-at-least-32-characters
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      APP_VERSION: ci
      E2E_ADMIN_EMAIL: admin@example.invalid
      E2E_ADMIN_PASSWORD: ci-demo-admin-password
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      SEED_ADMIN_EMAIL: admin@example.invalid
      SEED_ADMIN_PASSWORD: ci-demo-admin-password
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        if: >-
          needs.changes.outputs.database == 'true' ||
          needs.changes.outputs.website_e2e == 'true' ||
          needs.changes.outputs.admin_e2e == 'true' ||
          needs.changes.outputs.chat_e2e == 'true'
        run: pnpm db:migrate

      - name: Reset test database
        if: >-
          needs.changes.outputs.database == 'true' ||
          needs.changes.outputs.website_e2e == 'true' ||
          needs.changes.outputs.admin_e2e == 'true' ||
          needs.changes.outputs.chat_e2e == 'true'
        run: pnpm db:reset:test

      - name: Seed demo data twice
        if: >-
          needs.changes.outputs.database == 'true' ||
          needs.changes.outputs.website_e2e == 'true' ||
          needs.changes.outputs.admin_e2e == 'true' ||
          needs.changes.outputs.chat_e2e == 'true'
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: Integration tests
        if: needs.changes.outputs.database == 'true'
        run: pnpm test:integration

      - name: Verify Compose database persistence
        if: needs.changes.outputs.database == 'true'
        run: pnpm db:test:persistence

      - name: Production build
        if: >-
          needs.changes.outputs.production_image == 'true' ||
          needs.changes.outputs.website_e2e == 'true' ||
          needs.changes.outputs.admin_e2e == 'true' ||
          needs.changes.outputs.chat_e2e == 'true'
        run: pnpm build

      - name: Install Chromium for browser E2E
        if: >-
          needs.changes.outputs.website_e2e == 'true' ||
          needs.changes.outputs.admin_e2e == 'true' ||
          needs.changes.outputs.chat_e2e == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        if: >-
          needs.changes.outputs.website_e2e == 'true' ||
          needs.changes.outputs.admin_e2e == 'true' ||
          needs.changes.outputs.chat_e2e == 'true'
        env:
          ADMIN_E2E: ${{ needs.changes.outputs.admin_e2e }}
          CHAT_E2E: ${{ needs.changes.outputs.chat_e2e }}
          FULL_FALLBACK: ${{ needs.changes.outputs.full_fallback }}
          WEBSITE_E2E: ${{ needs.changes.outputs.website_e2e }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$FULL_FALLBACK" == 'true' ]]; then
            pnpm test:e2e
            exit 0
          fi

          specs=()
          if [[ "$WEBSITE_E2E" == 'true' ]]; then
            specs+=(tests/e2e/website.spec.ts)
          fi
          if [[ "$ADMIN_E2E" == 'true' ]]; then
            specs+=(tests/e2e/admin-visual.spec.ts)
            specs+=(tests/e2e/admin-portal-*.spec.ts)
          fi
          if [[ "$CHAT_E2E" == 'true' ]]; then
            specs+=(tests/e2e/chat-handoff.spec.ts)
          fi

          if [[ "${#specs[@]}" -eq 0 ]]; then
            echo 'Browser E2E was scheduled without a selected test suite.' >&2
            exit 1
          fi

          pnpm test:e2e -- "${specs[@]}"

      - name: Build runtime image for PR validation
        if: github.event_name == 'pull_request' && needs.changes.outputs.operations == 'true'
        run: >-
          docker build
          --target runtime
          --build-arg NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          --tag ivybm:ci .

      - name: Build job worker image for PR validation
        if: github.event_name == 'pull_request' && needs.changes.outputs.operations == 'true'
        run: docker build --target worker --tag ivybm-worker:ci .

      - name: Validate local runtime Compose configuration
        if: needs.changes.outputs.operations == 'true'
        env:
          AI_CONFIG_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          APP_VERSION: ci
          DATABASE_URL: postgres://postgres:postgres@db:5432/ivybm_ci
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          POSTGRES_DB: ivybm_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          SEED_ADMIN_EMAIL: admin@example.invalid
          SEED_ADMIN_PASSWORD: ci-demo-admin-password
        run: docker compose -f compose.yaml -f compose.staging.yaml config >/dev/null

      - name: Validate production operations configuration
        if: needs.changes.outputs.operations == 'true'
        run: pnpm test:operations

  ci_policy:
    name: ${{ github.event_name == 'push' && 'CI policy (main)' || 'CI diagnostics' }}
    needs: [changes, fast, full_gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      CODE: ${{ needs.changes.outputs.code }}
      DATABASE: ${{ needs.changes.outputs.database }}
      ADMIN_E2E: ${{ needs.changes.outputs.admin_e2e }}
      CHAT_E2E: ${{ needs.changes.outputs.chat_e2e }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      EVENT_NAME: ${{ github.event_name }}
      FAST_RESULT: ${{ needs.fast.result }}
      FULL_FALLBACK: ${{ needs.changes.outputs.full_fallback }}
      FULL_GATE_RESULT: ${{ needs.full_gate.result }}
      HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
      IS_DRAFT: ${{ github.event.pull_request.draft || false }}
      OPERATIONS: ${{ needs.changes.outputs.operations }}
      PRODUCTION_IMAGE: ${{ needs.changes.outputs.production_image }}
      WEBSITE_E2E: ${{ needs.changes.outputs.website_e2e }}
    steps:
      - name: Checkout policy implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.changes.outputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Enforce expected job results for this revision
        run: node scripts/ci/evaluate-policy.mjs

  publish_production_images:
    name: Publish immutable runtime and worker images
    needs: [changes, ci_policy]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.ci_policy.result == 'success' &&
      needs.changes.outputs.production_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.changes.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Define image namespace
        id: image
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        id: runtime
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.namespace }}/ivybm-runtime:${{ needs.changes.outputs.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.changes.outputs.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://ivybm.com
          cache-from: type=gha,scope=ivybm-production
          cache-to: type=gha,mode=max,scope=ivybm-production

      - name: Build and push worker image
        id: worker
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.image.outputs.namespace }}/ivybm-worker:${{ needs.changes.outputs.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.changes.outputs.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ivybm-production
          cache-to: type=gha,mode=max,scope=ivybm-production

      - name: Record published digests
        run: |
          {
            echo '## Published production images'
            echo ''
            echo "- Revision tag: \`${{ needs.changes.outputs.head_sha }}\`"
            echo "- Runtime: \`${{ steps.image.outputs.namespace }}/ivybm-runtime:${{ needs.changes.outputs.head_sha }}@${{ steps.runtime.outputs.digest }}\`"
            echo "- Worker: \`${{ steps.image.outputs.namespace }}/ivybm-worker:${{ needs.changes.outputs.head_sha }}@${{ steps.worker.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
