name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:0.8.5-pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
        env:
          POSTGRES_DB: ivybm_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ivybm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ivybm_ci
      PAYLOAD_SECRET: ci-build-only-secret-at-least-32-characters
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      APP_VERSION: ci
      E2E_ADMIN_EMAIL: admin@example.invalid
      E2E_ADMIN_PASSWORD: ci-demo-admin-password
      SEED_ADMIN_EMAIL: admin@example.invalid
      SEED_ADMIN_PASSWORD: ci-demo-admin-password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Documentation delivery contracts
        run: pnpm test:docs

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Reset test database
        run: pnpm db:reset:test

      - name: Seed demo data twice
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Verify Compose database persistence
        run: pnpm db:test:persistence

      - name: Production build
        run: pnpm build

      - name: Install Chromium for ChatWidget E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e -- tests/e2e/chat-handoff.spec.ts tests/e2e/admin-visual.spec.ts

      - name: Build runtime image
        run: >-
          docker build
          --target runtime
          --build-arg NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          --tag ivybm:ci .

      - name: Build job worker image
        run: docker build --target worker --tag ivybm-worker:ci .

      - name: Validate local runtime Compose configuration
        env:
          # Config validation must satisfy required interpolation without exposing real credentials.
          AI_CONFIG_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          APP_VERSION: ci
          DATABASE_URL: postgres://postgres:postgres@db:5432/ivybm_ci
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          POSTGRES_DB: ivybm_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          SEED_ADMIN_EMAIL: admin@example.invalid
          SEED_ADMIN_PASSWORD: ci-demo-admin-password
        run: docker compose -f compose.yaml -f compose.staging.yaml config >/dev/null

      - name: Validate production operations configuration
        run: pnpm test:operations
