name: Publish production images

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Publish immutable runtime and worker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Define image namespace
        id: image
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        id: runtime
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.namespace }}/ivybm-runtime:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://ivybm.com

      - name: Build and push worker image
        id: worker
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.image.outputs.namespace }}/ivybm-worker:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record published digests
        run: |
          {
            echo '## Published production images'
            echo ''
            echo "- Revision tag: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Runtime: \`${{ steps.image.outputs.namespace }}/ivybm-runtime:${{ github.event.workflow_run.head_sha }}@${{ steps.runtime.outputs.digest }}\`"
            echo "- Worker: \`${{ steps.image.outputs.namespace }}/ivybm-worker:${{ github.event.workflow_run.head_sha }}@${{ steps.worker.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
