x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: '5'

x-app-environment: &app-environment
  APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?NEXT_PUBLIC_SERVER_URL is required}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}

services:
  db:
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    mem_limit: 768m
    shm_size: 256m
    volumes:
      - type: bind
        source: ./docker/postgres/postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true

  migrate:
    image: '${WORKER_IMAGE:?WORKER_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}@${WORKER_IMAGE_DIGEST:?WORKER_IMAGE_DIGEST is required}'
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  app:
    image: '${RUNTIME_IMAGE:?RUNTIME_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}@${RUNTIME_IMAGE_DIGEST:?RUNTIME_IMAGE_DIGEST is required}'
    restart: unless-stopped
    mem_limit: 768m
    environment:
      <<: *app-environment
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:?AI_CONFIG_ENCRYPTION_KEY is required}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_TIMEOUT_MS: ${AI_EMBEDDING_TIMEOUT_MS:-15000}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_REASONING_ENABLED: ${AI_REASONING_ENABLED:-false}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-30000}
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NODE_OPTIONS: --no-deprecation --max-old-space-size=640
      PORT: 3000
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:?TRUST_PROXY_HEADERS is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:3000
    volumes:
      - media_data:/app/media
    logging: *default-logging

  worker:
    image: '${WORKER_IMAGE:?WORKER_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}@${WORKER_IMAGE_DIGEST:?WORKER_IMAGE_DIGEST is required}'
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *app-environment
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:?AI_CONFIG_ENCRYPTION_KEY is required}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_TIMEOUT_MS: ${AI_EMBEDDING_TIMEOUT_MS:-15000}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_REASONING_ENABLED: ${AI_REASONING_ENABLED:-false}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-30000}
      NODE_ENV: production
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      WORKER_HEARTBEAT_PATH: /tmp/ivybm-worker-heartbeat
      WORKER_JOB_HEARTBEAT_INTERVAL_MS: ${WORKER_JOB_HEARTBEAT_INTERVAL_MS:-30000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

volumes:
  postgres_data:
    name: ivybm-prod-postgres
  media_data:
    name: ivybm-prod-media
