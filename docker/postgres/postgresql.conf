# Tuned for the initial 2C4G single-host deployment. Docker retains log output
# on stderr so the Compose local logging driver can rotate it.
listen_addresses = '*'
max_connections = 40
shared_buffers = '192MB'
effective_cache_size = '512MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
logging_collector = off
