services:
  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}

  migrate:
    build:
      context: .
      target: tooling
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    environment: &app-environment
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?NEXT_PUBLIC_SERVER_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    logging: &app-logging
      driver: local
      options:
        max-size: 10m
        max-file: '5'

  seed:
    profiles: ['tools']
    build:
      context: .
      target: tooling
    command: ['pnpm', 'db:seed']
    restart: 'no'
    environment:
      <<: *app-environment
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
    logging: *app-logging

  app:
    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?NEXT_PUBLIC_SERVER_URL is required}
    restart: unless-stopped
    environment:
      <<: *app-environment
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:?AI_CONFIG_ENCRYPTION_KEY is required}
      CLOUDFLARE_CACHE_PURGE_ENABLED: ${CLOUDFLARE_CACHE_PURGE_ENABLED:-false}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      ADMIN_PORTAL_CONVERSATIONS_ENABLED: ${ADMIN_PORTAL_CONVERSATIONS_ENABLED:-false}
      ADMIN_PORTAL_PUBLISHING_ENABLED: ${ADMIN_PORTAL_PUBLISHING_ENABLED:-false}
      PLATFORM_CREDENTIAL_ENCRYPTION_KEY: ${PLATFORM_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_TIMEOUT_MS: ${AI_EMBEDDING_TIMEOUT_MS:-15000}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_REASONING_ENABLED: ${AI_REASONING_ENABLED:-false}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-30000}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_OAUTH_REDIRECT_URI: ${FEISHU_OAUTH_REDIRECT_URI:-}
      FEISHU_CREDENTIAL_ENCRYPTION_KEY: ${FEISHU_CREDENTIAL_ENCRYPTION_KEY:-}
      FEISHU_QR_REGISTRATION_ENABLED: ${FEISHU_QR_REGISTRATION_ENABLED:-false}
      HOSTNAME: 0.0.0.0
      META_APP_ID: ${META_APP_ID:-}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      META_WEBHOOK_ALLOWED_ACCOUNT_IDS: ${META_WEBHOOK_ALLOWED_ACCOUNT_IDS:-}
      META_WEBHOOK_APP_SECRET: ${META_WEBHOOK_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_OAUTH_REDIRECT_URI: ${INSTAGRAM_OAUTH_REDIRECT_URI:-}
      LINKEDIN_APP_ID: ${LINKEDIN_APP_ID:-}
      LINKEDIN_APP_SECRET: ${LINKEDIN_APP_SECRET:-}
      LINKEDIN_OAUTH_REDIRECT_URI: ${LINKEDIN_OAUTH_REDIRECT_URI:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-}
      LINKEDIN_UPLOAD_ALLOWED_ORIGINS: ${LINKEDIN_UPLOAD_ALLOWED_ORIGINS:-}
      LINKEDIN_UPLOAD_TICKET_KEY: ${LINKEDIN_UPLOAD_TICKET_KEY:-}
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health/ready').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - ${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000
    volumes:
      - media_data:/app/media
      - knowledge_sources_data:/app/private/knowledge-sources
      - knowledge_source_assets_data:/app/private/knowledge-source-assets
    logging: *app-logging

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-environment
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:?AI_CONFIG_ENCRYPTION_KEY is required}
      ADMIN_PORTAL_CONVERSATIONS_ENABLED: ${ADMIN_PORTAL_CONVERSATIONS_ENABLED:-false}
      ADMIN_PORTAL_PUBLISHING_ENABLED: ${ADMIN_PORTAL_PUBLISHING_ENABLED:-false}
      PLATFORM_CREDENTIAL_ENCRYPTION_KEY: ${PLATFORM_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_TIMEOUT_MS: ${AI_EMBEDDING_TIMEOUT_MS:-15000}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_REASONING_ENABLED: ${AI_REASONING_ENABLED:-false}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-30000}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_OAUTH_REDIRECT_URI: ${FEISHU_OAUTH_REDIRECT_URI:-}
      FEISHU_CREDENTIAL_ENCRYPTION_KEY: ${FEISHU_CREDENTIAL_ENCRYPTION_KEY:-}
      FEISHU_RELAY_INTERVAL_MS: ${FEISHU_RELAY_INTERVAL_MS:-30000}
      FEISHU_OAUTH_RECOVERY_INTERVAL_MS: ${FEISHU_OAUTH_RECOVERY_INTERVAL_MS:-30000}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-}
      LINKEDIN_UPLOAD_ALLOWED_ORIGINS: ${LINKEDIN_UPLOAD_ALLOWED_ORIGINS:-}
      LINKEDIN_UPLOAD_TICKET_KEY: ${LINKEDIN_UPLOAD_TICKET_KEY:-}
      NODE_ENV: production
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      WORKER_JOB_HEARTBEAT_INTERVAL_MS: ${WORKER_JOB_HEARTBEAT_INTERVAL_MS:-30000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - knowledge_sources_data:/app/private/knowledge-sources
      - knowledge_source_assets_data:/app/private/knowledge-source-assets
    logging: *app-logging

volumes:
  media_data:
  knowledge_sources_data:
  knowledge_source_assets_data:
