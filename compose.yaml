services:
  db:
    image: pgvector/pgvector:0.8.5-pg18@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ivybm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '5'

  worker:
    image: ${WORKER_IMAGE:-ivybm-worker:local}
    command: ['pnpm', 'worker']
    restart: unless-stopped
    mem_limit: 512m
    environment:
      AI_CONFIG_ENCRYPTION_KEY: ${AI_CONFIG_ENCRYPTION_KEY:-}
      PLATFORM_CREDENTIAL_ENCRYPTION_KEY: ${PLATFORM_CREDENTIAL_ENCRYPTION_KEY:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_TIMEOUT_MS: ${AI_EMBEDDING_TIMEOUT_MS:-15000}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_REASONING_ENABLED: ${AI_REASONING_ENABLED:-false}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_TEXT_TIMEOUT_MS: ${AI_TEXT_TIMEOUT_MS:-30000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/ivybm}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_OAUTH_REDIRECT_URI: ${FEISHU_OAUTH_REDIRECT_URI:-}
      FEISHU_CREDENTIAL_ENCRYPTION_KEY: ${FEISHU_CREDENTIAL_ENCRYPTION_KEY:-}
      FEISHU_RELAY_INTERVAL_MS: ${FEISHU_RELAY_INTERVAL_MS:-30000}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-only-secret-change-me}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-5000}
      WORKER_HEARTBEAT_PATH: /tmp/ivybm-worker-heartbeat
      WORKER_JOB_HEARTBEAT_INTERVAL_MS: ${WORKER_JOB_HEARTBEAT_INTERVAL_MS:-30000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const fs = require('node:fs'); try { const stat = fs.statSync(process.env.WORKER_HEARTBEAT_PATH || '/tmp/ivybm-worker-heartbeat'); if (Date.now() - stat.mtimeMs > 30000) process.exit(1) } catch { process.exit(1) }"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '5'

volumes:
  postgres_data:
